<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Purchase Fund — Plan, Allocate & Track Your Purchases</title>
    <meta name="description" content="Organize what you want to buy, decide where your money goes, and track your progress until you're ready to purchase. Local-first, private by design." />
    <meta name="theme-color" content="#6366f1" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Purchase Fund" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="My Purchase Fund — Plan, Allocate & Track Your Purchases" />
    <meta property="og:description" content="Organize what you want to buy, decide where your money goes, and track your progress until you're ready to purchase." />
    <meta property="og:image" content="/icon-512.png" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Purchase Fund — Plan, Allocate & Track Your Purchases" />
    <meta name="twitter:description" content="Organize what you want to buy, decide where your money goes, and track your progress until you're ready to purchase." />
    <style>
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #0f172a;
        color: #f8fafc;
        font: 700 22px/1.2 system-ui, sans-serif;
        opacity: 1;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #app-boot-splash span {
        animation: app-splash-name 900ms 120ms cubic-bezier(.2,.8,.2,1) both;
      }
      #app-boot-splash i {
        width: 42px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #818cf8, #c4b5fd);
        transform: scaleX(0);
        animation: app-splash-rule 900ms 240ms cubic-bezier(.2,.8,.2,1) both;
      }
      #app-boot-splash small {
        color: #94a3b8;
        font: 500 13px/1.3 system-ui, sans-serif;
        animation: app-splash-name 900ms 320ms cubic-bezier(.2,.8,.2,1) both;
      }
      #app-boot-splash[data-closing="true"] {
        visibility: hidden;
        opacity: 0;
      }
      @keyframes app-splash-name {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes app-splash-rule {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (display-mode: standalone) {
        #app-boot-splash { display: flex; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash span,
        #app-boot-splash i,
        #app-boot-splash small { animation: none; }
        #app-boot-splash { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <span>My Purchase Fund</span>
      <i></i>
      <small>Personal purchase planner</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
