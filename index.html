<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MITRA — Purchase • Pay • Plan</title>
    <meta name="description" content="MITRA brings Purchase Fund and Payment Tracker together in one private personal finance app." />
    <meta name="theme-color" content="#4c06a9" />
    <script>
      try {
        const preference = localStorage.getItem('platform_theme') || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MITRA" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MITRA — Purchase • Pay • Plan" />
    <meta property="og:description" content="One private finance app for planning purchases and tracking payments." />
    <meta property="og:image" content="/icon-512.png" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MITRA — Purchase • Pay • Plan" />
    <meta name="twitter:description" content="One private finance app for planning purchases and tracking payments." />
    <style>
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 40%, #fff 0, #f6f2ff 65%, #eeebf8 100%);
        color: #1b0d3f;
        opacity: 1;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #app-boot-splash img {
        width: min(82vw, 620px);
        height: auto;
        animation: app-splash-name 560ms cubic-bezier(.2,.8,.2,1) both;
      }
      #app-boot-splash .mitra-splash-dark { display: none; }
      #app-boot-splash i {
        width: 64px;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, #4c06a9, #14c77a, #ffca18);
        transform: scaleX(0);
        animation: app-splash-rule 620ms 80ms cubic-bezier(.2,.8,.2,1) both;
      }
      .dark #app-boot-splash {
        background: radial-gradient(ellipse at 50% 40%, #3f1671 0, #210944 55%, #14062d 100%);
        color: #fff;
      }
      .dark #app-boot-splash .mitra-splash-light { display: none; }
      .dark #app-boot-splash .mitra-splash-dark { display: block; }
      #app-boot-splash[data-closing="true"] {
        visibility: hidden;
        opacity: 0;
      }
      @keyframes app-splash-name {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes app-splash-rule {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (display-mode: standalone) {
        #app-boot-splash { display: flex; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash img,
        #app-boot-splash i,
        #app-boot-splash small { animation: none; }
        #app-boot-splash { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <img class="mitra-splash-light" src="/mitra-premium.svg" alt="MITRA — Purchase • Pay • Plan" />
      <img class="mitra-splash-dark" src="/mitra-logo-dark.svg" alt="" />
      <i></i>
      <small>Securely preparing your finance workspace…</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
